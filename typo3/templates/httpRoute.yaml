{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ default .Values.name .Values.httpRoute.name }}
  namespace: {{ default .Values.namespace .Values.httpRoute.namespace }}
spec:
  parentRefs:
  {{- range .Values.httpRoute.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
  {{- end }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
  {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
  {{- end }}
  {{- end }}
  rules:
  {{- range .Values.httpRoute.rules }}
    - matches:
      {{- range .matches }}
        - path:
            type: {{ .path.type }}
            value: {{ .path.value }}
      {{- end }}
      backendRefs:
      {{- range .backendRefs }}
        - name: {{ default $.Values.name .name }}
          port: {{ .port }}
      {{- end }}
  {{- end }}
{{- end }}
