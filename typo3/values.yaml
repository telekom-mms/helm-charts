name: typo3
namespace: default
replicas: 1
imagePullSecrets: []
service:
  ports:
  - name: "http"
    protocol: TCP
    port: 80
deployment:
  containers:
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        memory: "300Mi"
        cpu: "0.2"
        ephemeral_storage: "1500Mi"
      limits:
        memory: "600Mi"
        cpu: "0.4"
        ephemeral_storage: "1500Mi"
    lifecycle: |
      postStart:
        exec:
          command: ["/bin/sh", "-c", "cd /var/www/html/public && php typo3conf/ext/typo3_console/typo3cms install:fixfolderstructure && php typo3conf/ext/typo3_console/typo3cms cache:flush"]
    ports:
    - name: http
      containerPort: 80
    readinessProbe:
      probe: |
        httpGet:
          path: '/'
          port: http
      initialDelaySeconds: 30
      periodSeconds: 5
    livenessProbe:
      probe: |
        httpGet:
          path: '/'
          port: http
      initialDelaySeconds: 30
      periodSeconds: 5
    startupProbe:
      probe: |
        httpGet:
          path: '/'
          port: http
      failureThreshold: 10
      periodSeconds: 10
    volumeMounts:
      fileadmin:
        mountPath: "/var/www/html/public/fileadmin"
        subPath: "fileadmin"
      uploads:
        mountPath: "/var/www/html/public/uploads"
        subPath: "uploads"
      typo3temp:
        mountPath: "/var/www/html/public/typo3temp"
        subPath: "typo3temp"
  additionalContainers: []
persistentvolume:
  enabled: true
  name: typo3-pv
  capacity:
    storage: "10Gi"
  accessModes:
  - ReadWriteMany
  storageClassName: ""
  reclaimPolicy: Retain
  # volumeSource: |    # raw volume source block for static provisioning, e.g.:
  #   nfs:
  #     server: nfs-server.example.com
  #     path: /exports/typo3
persistentvolumeclaim:
  resources:
    requests:
      storage: 1Gi
