name: typo3
namespace: default
replicas: 1
imagePullSecrets: []

# mode controls the deployment topology.
# mod_php: single apache+mod_php container (default)
# fpm:     webserver sidecar + php-fpm container (communicating via Unix socket)
mode: mod_php

service:
  ports:
  - name: "http"
    protocol: TCP
    port: 80

# webserver is only used when mode=fpm.
# Configure the front-facing webserver container (e.g. nginx or apache).
webserver:
  image:
    registry: docker.io
    repository: nginx
    tag: "1.25"
  imagePullPolicy: "IfNotPresent"
  resources:
    requests:
      memory: "64Mi"
      cpu: "0.1"
      ephemeral_storage: "256Mi"
    limits:
      memory: "128Mi"
      cpu: "0.2"
      ephemeral_storage: "256Mi"
  ports:
  - name: http
    containerPort: 80

# phpfpm is only used when mode=fpm.
# The php-fpm container itself is configured via deployment.containers below.
phpfpm:
  # socketPath is the Unix socket used for webserver <-> php-fpm communication.
  socketPath: /run/php-fpm/php-fpm.sock

deployment:
  containers:
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        memory: "300Mi"
        cpu: "0.2"
        ephemeral_storage: "1500Mi"
      limits:
        memory: "600Mi"
        cpu: "0.4"
        ephemeral_storage: "1500Mi"
    ports:
    - name: http
      containerPort: 80
    readinessProbe:
      probe: |
        httpGet:
          path: '/'
          port: http
      initialDelaySeconds: 30
      periodSeconds: 5
    livenessProbe:
      probe: |
        httpGet:
          path: '/'
          port: http
      initialDelaySeconds: 30
      periodSeconds: 5
    startupProbe:
      probe: |
        httpGet:
          path: '/'
          port: http
      failureThreshold: 10
      periodSeconds: 10
    volumeMounts:
      fileadmin:
        mountPath: "/var/www/html/public/fileadmin"
        subPath: "fileadmin"
      uploads:
        mountPath: "/var/www/html/public/uploads"
        subPath: "uploads"
        typo3temp:
          mountPath: "/var/www/html/public/typo3temp"
          subPath: "typo3temp"
        # extra: additional named volumes to mount (name: mountPath)
        # extra:
        #   my-config: /var/www/html/config/my-config

persistentvolume:
  enabled: true
  name: typo3-pv
  capacity:
    storage: "10Gi"
  accessModes:
  - ReadWriteMany
  storageClassName: ""
  reclaimPolicy: Retain
  # volumeSource: |    # raw volume source block for static provisioning, e.g.:
  #   nfs:
  #     server: nfs-server.example.com
  #     path: /exports/typo3

persistentvolumeclaim:
  resources:
    requests:
      storage: 1Gi

httpRoute:
  enabled: false
  name: ""          # defaults to .Values.name
  namespace: ""     # defaults to .Values.namespace
  parentRefs:
    - name: ""
      namespace: ""
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ""  # defaults to .Values.name
          port: 80
