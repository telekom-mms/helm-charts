---
name: New release

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate_changelog:
    runs-on: ubuntu-latest
    name: create release draft
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Generate changelog
        uses: charmixer/auto-changelog-action@b25e89c9410e03189f0d48b02b3a8caad6e78015 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          future_release: ${{ steps.version.outputs.next-version }}

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: v3.8.1

      - name: Install helm plugin
        run: |
          helm plugin install https://github.com/sstarcher/helm-release

      - name: Update Chart.yaml
        run: |
          # Detect changes against the previous commit
          CHARTS=$(git diff --dirstat=files,0 HEAD^ HEAD | sed 's/^[ 0-9.]\+% //g' | cut -d/ -f1 | sort -u)
          
          CHANGES_MADE=false
          for CHART in $CHARTS; do
             if [ -f "$CHART/Chart.yaml" ]; then
               echo "Updating Chart.yaml for $CHART"
               helm release "$CHART" --skip-application-version
               git add "$CHART/Chart.yaml"
               CHANGES_MADE=true
             fi
          done

          if [ "$CHANGES_MADE" = true ]; then
             git commit -m "Bump chart versions [skip ci]"
             git push
          else
             echo "No chart updates found."
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: .
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Update documentation
        run: |
          for dir in */; do
            if [ -f "${dir}Chart.yaml" ]; then
              chart_name=$(basename "${dir}")
              mkdir -p "gh-pages-branch/${chart_name}"
              if [ -f "${dir}README.md" ]; then
                cp "${dir}README.md" "gh-pages-branch/${chart_name}/index.md"
              fi
            fi
          done

          echo "# Helm Charts" > gh-pages-branch/index.md
          for dir in */; do
            if [ -f "${dir}Chart.yaml" ]; then
              chart_name=$(basename "${dir}")
              echo "- [${chart_name}](./${chart_name}/)" >> gh-pages-branch/index.md
            fi
          done

          cd gh-pages-branch
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add .
          git commit -m "Update documentation" --allow-empty
          git push
